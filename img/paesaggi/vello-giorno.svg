    <linearGradient id="p-vello-mare" gradientUnits="userSpaceOnUse" x1="0" y1="199" x2="0" y2="270"><stop offset="0" stop-color="#2B9EC4"/><stop offset="1" stop-color="#08668C"/></linearGradient>
