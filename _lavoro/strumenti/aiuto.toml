# Le due pagine «Aiuto e domande» di Argonauta, in italiano e in inglese, affiancate: ogni testo ha le sue due
# voci, .it e .en. Qui si cambiano le parole; la forma delle pagine la dà strumenti/aiuto.py, che le riscrive:
#
#     python3 -I _lavoro/strumenti/aiuto.py
#
# Una domanda nuova è un blocco [[gruppo.domanda]] nel posto giusto, con le sue quattro voci. Nelle risposte ogni
# capoverso è un <p>…</p>; si può andare a capo dove si vuole. Tre cose le fa lo script e qui non si scrivono:
# - il pulsante che apre una parola di bordo, alla prima volta che la parola compare in una risposta (cerca.it e
#   cerca.en dicono come riconoscerla);
# - <cite> intorno ad «Argonautiche» e «Argonautica»;
# - l'apostrofo tipografico (’) al posto di quello dritto, tranne nelle frasi citate dalla privacy.
#
# Fra virgolette doppie "…" il testo corto; fra tre apici '''…''' quello su più righe; fra apici singoli '…' ciò
# che contiene virgolette doppie o barre rovesciate (i modelli di cerca).

[pagina]
occhiello.it = "Argonauta · aiuto"
occhiello.en = "Argonauta · help"
titolo.it = "Aiuto e domande"
titolo.en = "Help and questions"
introduzione.it = '''
Le risposte brevi alle domande su Argonauta. Se non trovi la tua, scrivi a
  <a href="mailto:vincenzo@sicstudio.app">vincenzo@sicstudio.app</a>.'''
introduzione.en = '''
Short answers to questions about Argonauta. If yours isn’t here, write to
  <a href="mailto:vincenzo@sicstudio.app">vincenzo@sicstudio.app</a>.'''
# Il nome dell'indice per chi usa un lettore di schermo, e il pulsante che chiude una parola di bordo.
indice.it = "In questa pagina"
indice.en = "On this page"
chiudi.it = "Chiudi"
chiudi.en = "Close"

# ---------- Prima di partire ----------

[[gruppo]]
id.it = "prima-di-partire"
id.en = "before-you-go"
id-del-titolo.it = "prima-titolo"
id-del-titolo.en = "before-title"
titolo.it = "Prima di partire"
titolo.en = "Before you go"

[[gruppo.domanda]]
chiede.it = "Come posso provarla?"
chiede.en = "How can I try it?"
risponde.it = '''
<p>Argonauta è in prova con TestFlight, l’app gratuita di Apple per provare le app prima che escano.
  Scrivimi a <a href="mailto:vincenzo@sicstudio.app?subject=Vorrei%20provare%20Argonauta">vincenzo@sicstudio.app</a>
  e ti mando l’invito.</p>'''
risponde.en = '''
<p>Argonauta is in testing with TestFlight, Apple’s free app for trying apps before they come out.
  Write to me at <a href="mailto:vincenzo@sicstudio.app?subject=I%27d%20like%20to%20try%20Argonauta">vincenzo@sicstudio.app</a>
  and I’ll send you an invitation.</p>'''

[[gruppo.domanda]]
chiede.it = "Serve la rete?"
chiede.en = "Do I need a network connection?"
risponde.it = '''
<p>Per camminare no. La mappa, le rotte, la navigazione, l’Atlante e Argo sono dentro l’app e funzionano
  anche senza campo.</p>
<p>La rete serve solo per le mappe «Ibrida» e «Satellite» di Apple, per cercare su quelle mappe e per un
  livello di luoghi che all’inizio è spento.</p>'''
risponde.en = '''
<p>Not for walking. The map, the routes, the navigation, the Atlas and Argo are inside the app and work even
  without signal.</p>
<p>You need the network only for Apple’s “Hybrid” and “Satellite” maps, to search on those maps, and for a
  layer of places that is off at the start.</p>'''

[[gruppo.domanda]]
chiede.it = "Quale permesso della posizione chiede? Perché mai «Sempre»?"
chiede.en = "Which location permission does it ask for? Why never “Always”?"
risponde.it = '''
<p>Argonauta chiede la posizione solo «Durante l’uso», mai «Sempre». Quando avvii una rotta continua a
  seguirti anche con lo schermo bloccato, e iOS lo mostra con l’indicatore della posizione.</p>
<p>Quando metti in pausa, esci dalla rotta o arrivi, smette di seguirti. Per seguire una rotta serve
  anche «Posizione esatta».</p>'''
risponde.en = '''
<p>Argonauta asks for your location only “While Using the App”, never “Always”. When you start a route it
  keeps following you even with the screen locked, and iOS shows it with the location indicator.</p>
<p>When you pause, exit the route or arrive, it stops following you. To follow a route you also need
  “Precise Location”.</p>'''

[[gruppo.domanda]]
chiede.it = "Su quali dispositivi funziona?"
chiede.en = "Which devices does it work on?"
risponde.it = '''
<p>Su iPhone e iPad con iOS o iPadOS 26.1 o successivo. Sull’iPhone l’app sta in verticale; sull’iPad gira
  in tutte le direzioni, con il pannello di Odissea a sinistra, come in Mappe.</p>'''
risponde.en = '''
<p>On iPhone and iPad with iOS or iPadOS 26.1 or later. On iPhone the app stays in portrait; on iPad it turns
  in every direction, with the Odyssey panel on the left, as in Maps.</p>'''

[[gruppo.domanda]]
chiede.it = "Posso camminare con un iPad?"
chiede.en = "Can I walk with an iPad?"
risponde.it = '''
<p>Gli iPad solo Wi‑Fi non hanno il GPS: sul sentiero serve un iPhone o un iPad con rete cellulare. Quando
  la posizione manca o è imprecisa, l’app lo scrive.</p>
<p>Sull’iPad non c’è il pulsante «Chiama il 112», perché l’iPad non telefona.</p>'''
risponde.en = '''
<p>Wi‑Fi‑only iPads don’t have GPS: on the trail, use an iPhone or a Wi‑Fi + Cellular iPad. When your location
  is missing or inaccurate, the app says so.</p>
<p>On iPad there’s no “Call 112” button, because iPad doesn’t make phone calls.</p>'''

# ---------- In cammino ----------

[[gruppo]]
id.it = "in-cammino"
id.en = "on-the-trail"
id-del-titolo.it = "cammino-titolo"
id-del-titolo.en = "trail-title"
titolo.it = "In cammino"
titolo.en = "On the trail"

[[gruppo.domanda]]
chiede.it = "Cosa succede se esco dalla rotta?"
chiede.en = "What happens if I leave the route?"
risponde.it = '''
<p>Se resti a più di 80 metri dalla rotta per almeno 30 secondi, Argonauta te lo dice una volta: con la
  navigazione aperta il telefono vibra, a schermo bloccato arriva la notifica «Sei fuori percorso», con
  la distanza dalla rotta.</p>
<p>Sulla mappa la linea diventa arancione finché non rientri. Una posizione fuori rotta non fa avanzare
  la rotta e non completa tappe.</p>'''
risponde.en = '''
<p>If you stay more than 80 metres from the route for at least 30 seconds, Argonauta tells you once: with the
  navigation open the phone vibrates, with the screen locked you get the notification “You’re off route”,
  with your distance from the route.</p>
<p>On the map the line turns orange until you’re back. A position off the route doesn’t move the route
  forward and doesn’t complete stages.</p>'''

[[gruppo.domanda]]
chiede.it = "Quali notifiche manda? E la Live Activity?"
chiede.en = "Which notifications does it send? And the Live Activity?"
risponde.it = '''
<p>Le notifiche nascono sul telefono, solo durante una rotta e solo quando l’app non è davanti: «Tappa
  raggiunta», «Sei all’arrivo» e «Sei fuori percorso». iOS chiede il permesso la prima volta che tocchi
  «Avvia».</p>
<p>Sulla schermata di blocco e nell’Isola Dinamica, la Live Activity mostra la prossima tappa, quanto
  manca e quanta rotta hai percorso.</p>'''
risponde.en = '''
<p>Notifications are created on the phone, only during a route and only when the app isn’t in front:
  “Stage reached”, “You’ve arrived” and “You’re off route”. iOS asks for permission the first time you tap
  “Start”.</p>
<p>On the Lock Screen and in the Dynamic Island, the Live Activity shows the next stage, how far it is and how
  much of the route you’ve walked.</p>'''

[[gruppo.domanda]]
chiede.it = "Perché l’app non dice se un sentiero è aperto?"
chiede.en = "Why doesn’t the app say whether a trail is open?"
risponde.it = '''
<p>Perché le condizioni dei sentieri cambiano, e l’app non ha una fonte aggiornata per saperlo. Per questo
  non dice mai se un sentiero è aperto o in buone condizioni, né se un’acqua si può bere.</p>
<p>Prima di partire chiedi a chi gestisce l’area protetta o al CAI, e guarda un servizio meteo
  ufficiale.</p>'''
risponde.en = '''
<p>Because trail conditions change, and the app has no up-to-date source to know them. That’s why it never
  says whether a trail is open or in good condition, or whether water is drinkable.</p>
<p>Before you set off, ask whoever manages the protected area or the CAI, the Italian Alpine Club, and check
  an official weather service.</p>'''

[[gruppo.domanda]]
chiede.it = "Cosa faccio in un’emergenza?"
chiede.en = "What should I do in an emergency?"
risponde.it = '''
<p>Chiama il 112: è il numero unico per le emergenze. Argonauta non è un servizio di
  soccorso, ma nel foglio «Sicurezza» trovi «Chiama il 112», le tue coordinate da leggere a chi risponde
  e «Manda dove sei».</p>
<p>Se non c’è campo, su iPhone 14 e successivi chiama comunque il 112: se la chiamata non parte,
  l’iPhone propone di scrivere ai soccorsi via satellite.</p>'''
risponde.en = '''
<p>Call 112: it’s the single emergency number. Argonauta isn’t a rescue service, but in
  the “Safety” sheet you’ll find “Call 112”, your coordinates to read to the operator, and “Send My
  Location”.</p>
<p>If there’s no signal, on iPhone 14 and later call 112 anyway: if the call doesn’t go through, iPhone offers
  to text emergency services via satellite.</p>'''

[[gruppo.domanda]]
chiede.it = "Cosa c’è in «Prima di partire»?"
chiede.en = "What’s in “Before You Set Off”?"
risponde.it = '''
<p>Nella pagina di ogni rotta, l’app calcola sul telefono, anche senza rete, l’alba, il tramonto, il buio
  e la luna. Con il tempo del CAI ti dice a che ora arriveresti partendo adesso, e ti avvisa se
  arriveresti dopo il tramonto.</p>
<p>Sotto ci sono tre consigli, «Lascia detto dove vai» e il foglio «Sicurezza».</p>'''
risponde.en = '''
<p>On every route page, the app works out on the phone, even offline, the sunrise, sunset, dark and the moon.
  With the CAI’s walking time it tells you when you’d arrive if you set off now, and warns you if you’d
  arrive after sunset.</p>
<p>Below there are three tips, “Tell Someone Your Plans” and the “Safety” sheet.</p>'''

# ---------- L’Atlante e Argo ----------

[[gruppo]]
id.it = "atlante-e-argo"
id.en = "atlas-and-argo"
id-del-titolo.it = "atlante-titolo"
id-del-titolo.en = "atlas-title"
titolo.it = "L’Atlante e Argo"
titolo.en = "The Atlas and Argo"

[[gruppo.domanda]]
chiede.it = "Come entra una scheda nella collezione?"
chiede.en = "How does a card join my collection?"
risponde.it = '''
<p>Le schede dell’Atlante si leggono tutte, sempre. Una scheda «Da scoprire» entra «Nella collezione»
  quando fai una cosa vera in Odissea: avvii o finisci una rotta, o ne raggiungi una tappa. Alcune ci
  sono già dall’inizio.</p>
<p>Per gli animali e le piante, scoprire la scheda non vuol dire averli visti: la scheda arriva con la
  rotta.</p>'''
risponde.en = '''
<p>The cards of the Atlas can all be read, always. A card “To discover” joins “In your collection” when you do
  something real in Odyssey: you start or finish a route, or reach one of its stages. Some are there from
  the start.</p>
<p>For animals and plants, discovering the card doesn’t mean you’ve seen them: the card comes with the
  route.</p>'''

[[gruppo.domanda]]
chiede.it = "Perché Argo non risponde a tutto?"
chiede.en = "Why doesn’t Argo answer everything?"
risponde.it = '''
<p>Argo risponde solo con quello che c’è nelle schede dell’Atlante, e sotto la risposta ti mostra la
  scheda da cui viene. Se le schede non lo dicono, risponde «Non lo trovo nelle schede dell’Atlante».</p>
<p>Su emergenze, salute, funghi e piante da mangiare, acqua da bere, sentieri e meteo non inventa niente:
  dà sempre la stessa risposta, e per le emergenze ti indica il 112.</p>'''
risponde.en = '''
<p>Argo answers only with what’s in the cards of the Atlas, and under the answer it shows you the card it
  comes from. If the cards don’t say it, it answers “I can’t find it in the Atlas cards.”</p>
<p>On emergencies, health, mushrooms and plants to eat, drinking water, trails and weather it makes nothing
  up: it always gives the same answer, and for emergencies it points you to 112.</p>'''

[[gruppo.domanda]]
chiede.it = "Cosa sono «Miti e leggende»?"
chiede.en = "What are “Myths and Legends”?"
risponde.it = '''
<p>Racconti tramandati in un luogo vero, che Argo racconta quando arrivi. L’app li segna sempre come
  «Mito» o «Leggenda», cita la fonte e non li presenta mai come storia.</p>'''
risponde.en = '''
<p>Tales handed down in a real place, which Argo tells you when you arrive. The app always marks them as
  “Myth” or “Legend”, cites the source and never presents them as history.</p>'''

[[gruppo.domanda]]
chiede.it = "Ho trovato un errore in una scheda."
chiede.en = "I found a mistake in a card."
risponde.it = '''
<p>Ogni scheda dice da quali fonti viene. Se trovi qualcosa che non torna, scrivimi a
  <a href="mailto:vincenzo@sicstudio.app">vincenzo@sicstudio.app</a> con il nome della scheda: nell’app
  non c’è un modulo per segnalarlo.</p>'''
risponde.en = '''
<p>Every card says which sources it comes from. If something doesn’t add up, write to
  <a href="mailto:vincenzo@sicstudio.app">vincenzo@sicstudio.app</a> with the name of the card: there’s no
  form in the app to report it.</p>'''

# ---------- La nave e il viaggio ----------

[[gruppo]]
id.it = "nave-e-viaggio"
id.en = "ship-and-voyage"
id-del-titolo.it = "nave-titolo"
id-del-titolo.en = "ship-title"
titolo.it = "La nave e il viaggio"
titolo.en = "The ship and the voyage"

[[gruppo.domanda]]
chiede.it = "Come cresce la nave?"
chiede.en = "How does the ship grow?"
risponde.it = '''
<p>Con le rotte completate davvero: lo scafo con i remi all’inizio, l’albero alla prima rotta, la vela
  spiegata alla terza, la nave completa alla quinta.</p>
<p>Niente a sorte e niente fretta: se l’app resta chiusa, la nave ti aspetta com’era.</p>'''
risponde.en = '''
<p>With the routes you really complete: the hull with the oars at the start, the mast at the first route, the
  sail unfurled at the third, the complete ship at the fifth.</p>
<p>Nothing left to chance and no hurry: if the app stays closed, the ship waits for you as it was.</p>'''

[[gruppo.domanda]]
chiede.it = "Chi sale a bordo?"
chiede.en = "Who comes aboard?"
risponde.it = '''
<p>Gli eroi delle Argonautiche di Apollonio Rodio, ognuno con una cosa fatta davvero: Orfeo quando avvii
  la prima rotta, Tifi quando la completi, Mopso quando l’aquila reale entra nella collezione, Linceo con
  sei schede nuove, Eracle con cinque rotte.</p>
<p>Nel foglio dell’Equipaggio ci sono anche gli altri Argonauti, ognuno con il suo mito e la fonte.</p>'''
risponde.en = '''
<p>The heroes of Apollonius of Rhodes’ Argonautica, each with something you really did: Orpheus when you start
  your first route, Tiphys when you complete it, Mopsus when the golden eagle joins your collection, Lynceus
  with six new cards, Heracles with five routes.</p>
<p>In the Heroes sheet there are also the other Argonauts, each with their myth and its source.</p>'''

[[gruppo.domanda]]
chiede.it = "Cos’è il viaggio di Argo?"
chiede.en = "What is the Voyage of Argo?"
risponde.it = '''
<p>È il viaggio delle Argonautiche. Argo parte da Pagase, e ogni rotta completata la porta all’approdo
  dopo: Lemno, Cizico, le Simplegadi, la Colchide e, alla quinta rotta, il vello d’oro. Ogni approdo ha
  il suo episodio, con l’etichetta «Mito» e la fonte.</p>
<p><a href="/argonauta/il-mito/">Leggi il mito di Argo</a></p>'''
risponde.en = '''
<p>It’s the voyage of the Argonautica. Argo sets off from Pagasae, and every route you complete brings it to
  the next landfall: Lemnos, Cyzicus, the Clashing Rocks, Colchis and, at the fifth route, the Golden Fleece.
  Every landfall has its episode, with the label “Myth” and its source.</p>
<p><a href="/en/argonauta/the-myth/">Read the myth of Argo</a></p>'''

[[gruppo.domanda]]
chiede.it = "Come funzionano badge e livelli?"
chiede.en = "How do badges and levels work?"
risponde.it = '''
<p>Ogni tappa raggiunta e ogni rotta completata danno punti esperienza. I livelli si chiamano Apprendista,
  Viandante, Navigante, Vedetta, Comandante e Argonauta.</p>
<p>I badge sono medaglie d’oro che si conquistano con le rotte, le missioni e le schede nuove.</p>'''
risponde.en = '''
<p>Every stage you reach and every route you complete give experience points. The levels are called
  Apprentice, Wayfarer, Seafarer, Lookout, Commander and Argonaut.</p>
<p>Badges are gold medals you earn with routes, missions and new cards.</p>'''

# ---------- I dati e la lingua ----------

[[gruppo]]
id.it = "dati-e-lingua"
id.en = "data-and-language"
id-del-titolo.it = "dati-titolo"
id-del-titolo.en = "data-title"
titolo.it = "I dati e la lingua"
titolo.en = "Data and language"

[[gruppo.domanda]]
chiede.it = "Come cancello i miei dati?"
chiede.en = "How do I delete my data?"
risponde.it = '''
<p>«I dati sul dispositivo sono solo tuoi: per cancellarli basta togliere l'app.»</p>
<p><a href="/argonauta/privacy/">Leggi l’informativa sulla privacy</a></p>'''
risponde.en = '''
<p>“The data on your device is yours alone: to delete it, just remove the app.”</p>
<p><a href="/argonauta/privacy/#en">Read the privacy policy</a></p>'''

[[gruppo.domanda]]
chiede.it = "L’app c’è in inglese?"
chiede.en = "Is the app in English?"
risponde.it = '''
<p>Sì. Argonauta parla italiano e inglese e segue la lingua del dispositivo: è in italiano su un
  dispositivo in italiano, in inglese in tutte le altre lingue.</p>
<p>Sono in inglese anche le schede, le tappe, gli eroi e il viaggio; i nomi propri e le citazioni delle
  fonti restano come sono.</p>'''
risponde.en = '''
<p>Yes. Argonauta speaks Italian and English and follows your device’s language: it’s in Italian on a device
  in Italian, and in English in every other language.</p>
<p>The cards, the stages, the heroes and the voyage are in English too; proper names and quoted sources stay
  as they are.</p>'''

[[gruppo.domanda]]
chiede.it = "Funziona con Siri e Comandi Rapidi?"
chiede.en = "Does it work with Siri and Shortcuts?"
risponde.it = '''
<p>Con Siri e Comandi Rapidi puoi aprire il foglio di Argo, l’Atlante o una scheda per nome, per esempio
  «Apri Lupo appenninico in Argonauta». Le schede si trovano anche nella ricerca dell’iPhone.</p>
<p>Argo però risponde sempre nel suo foglio, dentro l’app.</p>'''
risponde.en = '''
<p>With Siri and Shortcuts you can open Argo’s sheet, the Atlas or a card by name, for example “Open Apennine
  wolf in Argonauta”. The cards also show up in iPhone search.</p>
<p>Argo, though, always answers in its own sheet, inside the app.</p>'''

